<style>
:root{--paper:#E6ECE8;--paper2:#DCE4DF;--card:#F1F5F2;--ink:#0F1C19;--ink2:#3F544E;--mute:#4D6159;--line:rgba(15,28,25,.17);--line2:rgba(15,28,25,.08);--acc:#E8930C;--acc-t:#8F5200;--acc-soft:rgba(232,147,12,.12);--hi:#B3261E;--md:#C77700;--lo:#6B7B75;--ok:#2E7D32;--fh:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--fb:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--fm:'DM Mono',ui-monospace,Menlo,monospace}
:root[data-theme=dark]{--paper:#0B1714;--paper2:#10201C;--card:#12211D;--ink:#E4ECE8;--ink2:#AEC2BB;--mute:#86A097;--line:rgba(228,236,232,.16);--line2:rgba(228,236,232,.08);--acc:#FFB03A;--acc-t:#FFB03A;--acc-soft:rgba(255,176,58,.12);--hi:#FF7A70;--md:#FFB03A;--lo:#8FA79E;--ok:#6CCB72}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--fh);font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--acc-t)}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);}
.bar{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--fh);font-weight:600;font-size:18px;text-decoration:none;color:var(--ink)}.brand small{font-family:var(--fm);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc-t);margin-left:8px}
.sp{flex:1}.who{font-size:13px;color:var(--mute)}
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--ink2)}
.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sm{padding:4px 10px;font-size:12.5px}
nav.tabs{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--mute);font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:24px 20px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat .n{font-family:var(--fh);font-size:38px;font-weight:600;line-height:1.1}.stat .l{color:var(--mute);font-size:13px;margin-top:2px}
.mono{font-family:var(--fm);font-size:12.5px}
.lead{color:var(--ink2);max-width:720px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:var(--acc-soft)}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid currentColor}
.hi{color:var(--hi)}.md{color:var(--md)}.lo{color:var(--lo)}.ok{color:var(--ok)}
.bars .r{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}.bars .nm{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{flex:1;height:12px;background:var(--line2);border-radius:6px;overflow:hidden;display:block}.bars .tr i{display:block;height:100%}.b2{margin:12px 0}.b2 .r{margin:0 0 2px}
input,select{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
label{font-size:13px;color:var(--mute);font-weight:600;display:block;margin:12px 0 4px}
.auth{max-width:420px;margin:60px auto}
.err{color:var(--hi);font-size:14px;margin-top:10px}
pre{background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:8px;overflow-x:auto;font-family:var(--fm);font-size:12.5px;margin:6px 0;white-space:pre-wrap;word-break:break-all}
.det{background:var(--paper2)}
.det td{padding:14px 18px}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}

@media(max-width:640px){main{padding:16px 14px 60px}.bars .nm{width:100px}.b2 .mono{margin-left:110px!important}}
.rp h1{font-size:32px;margin-top:4px}.rp .kick{font:500 11px var(--fm);letter-spacing:1.5px;text-transform:uppercase;color:var(--ra)}.rp .big{font-size:19px;line-height:1.5;max-width:860px;margin:12px 0 20px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.kp>div{padding:14px 16px;border-right:1px solid var(--line2)}.kp b{display:block;font:600 28px var(--fh);line-height:1.15}.kp span{font-size:12.5px;color:var(--mute)}
.cc{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}.cc:hover{border-color:var(--ink2)}.cc.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;border:1px solid currentColor;margin:0 4px 3px 0}
.pl3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rpc{border-top:4px solid var(--acc)}.rc-cat{border-top-color:#0E7C86}.rc-map{border-top-color:#FF6B5E}.rc-card{border-top-color:#5B4BC4}.rc-led{border-top-color:#2E7D32}
.so .tagx{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 8px;font-size:13px;margin:0 6px 6px 0}.so .tagx b{color:#0E7C86;margin-left:4px}
.catc{border:1px solid var(--line);border-left:5px solid #0E7C86;border-radius:10px;padding:14px 16px;background:var(--card)}
.sx{background:#0A1220;color:#D8E3F0;border-radius:16px;padding:26px 24px;margin:-6px 0}.sx h1,.sx h2,.sx h3,.sx b{color:#fff}.sx .big{color:#D8E3F0}.sx .noprint .sm{background:#16233A;color:#D8E3F0;border-color:#2A3B58}
.sx .hm{border-collapse:separate;border-spacing:3px}.sx .hm th{color:#8FA6C4;border-bottom:1px solid #22324D}.sx .hm td{border-bottom:0;padding:4px;vertical-align:middle}.sx .hm td:first-child{color:#D8E3F0}
.hc{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;border-radius:6px;font:600 13px var(--fm);color:#fff}.hc.high{background:#C62828}.hc.medium{background:#B26A00}.hc.low{background:#4F6586}.hc.z{background:#111C30}
.sxp{border:1px solid #2A3B58;background:#0F1A2E;border-radius:10px;padding:12px 16px;margin-bottom:10px}.sxp p{margin:6px 0;color:#C2D0E4;font-size:14px}.sxp .fxs{color:#8EE6A0}.khi{color:#FF8A80;font-weight:700}
.kcols{display:flex;gap:22px;flex-wrap:wrap}.kcol b{display:block;font:600 28px var(--fh)}.kcol small{font-size:15px;color:var(--mute)}.kcol span{font-size:12.5px;color:var(--mute)}
.kt{text-align:center;width:90px}.kl td.kt span{font-size:18px;font-weight:700}.dots i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);margin-right:3px}.dots i.on.lo2{background:var(--hi)}.dots i.on.mid{background:var(--md)}.dots i.on.full{background:var(--ok)}
.rc .led{border:1px solid var(--ink);border-radius:4px;background:var(--card);padding:0 4px 4px}.rc .ledh{display:flex;justify-content:space-between;padding:12px 10px;border-bottom:3px double var(--ink);font-weight:600}.rc .num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.rc tfoot td{border-top:3px double var(--ink);border-bottom:0;padding-top:12px}.bb{height:8px;background:var(--line2);border-radius:4px;margin:3px 0;overflow:hidden}.bb i{display:block;height:100%}.bb .c{background:var(--md)}.bb .g{background:var(--ok)}.kc,.kg{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px}.kc{background:var(--md)}.kg{background:var(--ok)}
@media print{.top,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff}.sx{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr.row{break-inside:avoid}}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var SB_URL='https://oxmoenclvifxhgwsxfop.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94bW9lbmNsdmlmeGhnd3N4Zm9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxODM2NDcsImV4cCI6MjEwNTc1OTY0N30.6gCGL67utfa0ApERu6an_wDw3I_KNnQLINO9FAQEoQA';
var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var S={session:null,orgs:[],org:null,data:null,tab:'overview',filt:{sev:'',st:'open',mod:'',q:''},open:null,newToken:null,audit:null};
var DAY=864e5, MODS={discover:['Soundings','What AI is running here'],secure:['Sentinel','What it can do, and who could trick it'],govern:['Keel','Who is accountable for it'],economics:['Reckoning','What it costs and what it earns']};
var SEVN={high:'High',medium:'Medium',low:'Low',info:'Note'}, SEVC={high:'hi',medium:'md',low:'lo',info:'lo'};
try{var th=localStorage.getItem('ns-theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
$('theme').onclick=function(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ns-theme',t)}catch(e){}};

function api(action,extra){
  return fetch(SB_URL+'/functions/v1/ns-portal',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+S.session.access_token},body:JSON.stringify(Object.assign({action:action,org_id:S.org&&S.org.id},extra||{}))})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||('Error '+r.status));return j})});
}
function ago(t){if(!t)return 'never';var d=Date.now()-new Date(t).getTime();if(d<6e4)return 'just now';if(d<36e5)return Math.round(d/6e4)+' min ago';if(d<DAY)return Math.round(d/36e5)+' h ago';return Math.round(d/DAY)+' days ago'}
function pill(s){return '<span class="pill '+SEVC[s]+'">'+SEVN[s]+'</span>'}
function split(d){d=d||'';var a=d.split(' Why it matters: '),claim=a[0],rest=a[1]||'',b=rest.split(' What to do: ');return{claim:claim,why:b[0]||'',fix:b[1]||''}}

/* ---------- sign in ---------- */
function authView(msg){
  $('tabs').style.display='none';$('out').style.display='none';$('orgsel').style.display='none';$('who').textContent='';
  $('app').innerHTML='<div class="auth card"><h1 style="font-size:28px">Sign in</h1><p class="lead">See every computer that reports to you, what AI it is running, and what needs fixing.</p>'+
  '<label>Work email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">'+
  '<div style="display:flex;gap:10px;margin-top:16px"><button class="pri" id="si">Sign in</button><button id="su">Create account</button></div><div class="err" id="ae">'+esc(msg||'')+'</div>'+
  '<p class="mono" style="color:var(--mute);margin-top:18px">New here? Click Create account with the work email Antara has on file for you. You land in your own company workspace straight away.</p></div>';
  var go=function(up){var e=$('em').value.trim(),p=$('pw').value;$('ae').textContent='';if(!e||p.length<10){$('ae').textContent='Use your email and a password of at least 10 characters.';return}
    (up?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p})).then(function(r){if(r.error){$('ae').textContent=r.error.message;return}if(!r.data.session){$('ae').textContent='Check your email to confirm the account, then sign in.';return}S.session=r.data.session;boot()})};
  $('si').onclick=function(){go(false)};$('su').onclick=function(){go(true)};$('pw').onkeydown=function(e){if(e.key==='Enter')go(false)};
}
function inviteView(msg){
  $('tabs').style.display='none';$('out').style.display='';$('who').textContent=S.email||'';
  $('app').innerHTML='<div class="auth card"><h1 style="font-size:26px">No workspace for this email yet</h1><p class="lead">You are signed in as <b>'+esc(S.email||'')+'</b>, but Antara has not set up a workspace for this address. Ask your Antara contact to add it, then sign in again.</p><div style="margin-top:12px"><button class="pri" id="rl">Check again</button></div>'+
  '<details style="margin-top:20px"><summary class="mono" style="cursor:pointer;color:var(--mute)">I was given a code instead</summary><label>Code</label><input id="ic" placeholder="Paste your code here"><div style="margin-top:12px"><button id="ir">Join</button></div></details><div class="err" id="ae">'+esc(msg||'')+'</div></div>';
  $('rl').onclick=function(){boot()};
  $('ir').onclick=function(){api('redeem_invite',{code:$('ic').value.trim()}).then(function(){boot()}).catch(function(e){$('ae').textContent=e.message})};
}

/* ---------- shell ---------- */
var TABS=[['overview','Overview'],['computers','Computers'],['ai','AI found'],['findings','Findings'],['reports','Reports'],['add','Add computers'],['activity','Activity']];
function shell(){
  $('who').textContent=(S.email||'')+' · '+(S.org?S.org.role:'');$('out').style.display='';
  var sel=$('orgsel');if(S.orgs.length>1){sel.style.display='';sel.innerHTML=S.orgs.map(function(o){return '<option value="'+esc(o.id)+'"'+(S.org&&o.id===S.org.id?' selected':'')+'>'+esc(o.name)+'</option>'}).join('')}else sel.style.display='none';
  $('tabs').style.display='';$('tabs').innerHTML=(S.isOp?[['clients','All clients']].concat(TABS):TABS).map(function(t){return '<a href="#'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('');
}
$('orgsel').onchange=function(){S.org=S.orgs.filter(function(o){return o.id===$('orgsel').value})[0];load()};
$('out').onclick=function(){sb.auth.signOut().then(function(){S.session=null;authView()})};
window.addEventListener('hashchange',function(){S.tab=(location.hash||'#overview').slice(1);S.open=null;S.rep=null;if(S.tab==='clients'&&S.isOp){opLoad();return}if(S.data){if(!S.org){load();return}render()}});

function boot(){
  S.tab=(location.hash||'#overview').slice(1)||'overview';
  api('me').then(function(m){S.email=m.email;S.orgs=m.orgs;S.isOp=m.is_operator;if(S.isOp&&(!m.orgs.length||S.tab==='clients')){S.tab='clients';return opLoad()}if(!m.orgs.length)return inviteView();S.org=S.org&&m.orgs.filter(function(o){return o.id===S.org.id})[0]||m.orgs[0];load()}).catch(function(e){if(/sign in/i.test(e.message)){sb.auth.signOut();authView('Your session ended. Please sign in again.')}else authView(e.message)});
}
function load(){
  $('app').innerHTML='<div class="empty">Loading...</div>';
  api('overview').then(function(d){S.data=d;S.org.role=d.role;render()}).catch(function(e){$('app').innerHTML='<div class="empty err">'+esc(e.message)+'</div>'});
}

/* ---------- numbers ---------- */
function stats(){
  var d=S.data,open=d.findings.filter(function(f){return f.status==='open'&&f.severity!=='info'});
  var g=groups(open),c={high:0,medium:0,low:0};g.forEach(function(x){c[x.sev]++});
  var wk=Date.now()-7*DAY;
  var fresh=d.devices.filter(function(x){return x.status==='active'&&x.last_seen&&Date.now()-new Date(x.last_seen).getTime()<3*DAY}).length;
  return{open:open,g:g,c:c,fresh:fresh,active:d.devices.filter(function(x){return x.status==='active'}).length,
    newWk:d.findings.filter(function(f){return f.severity!=='info'&&new Date(f.first_seen).getTime()>wk}).length,
    fixedWk:d.findings.filter(function(f){return f.status==='fixed'&&f.resolved_at&&new Date(f.resolved_at).getTime()>wk}).length};
}
/* ---------- views ---------- */
function vOverview(){
  var d=S.data,s=stats();
  if(!d.devices.length)return '<div class="card empty"><h2>No computers yet</h2><p>Add your first computer and its findings will appear here within minutes.</p><a class="btn pri" href="#add">Add computers</a></div>';
  var units={};s.open.forEach(function(f){var u=bu(f);units[u]=units[u]||{high:0,medium:0,low:0};units[u][f.severity]++});
  var us=Object.keys(units).sort(function(a,b){return(units[b].high*3+units[b].medium)-(units[a].high*3+units[a].medium)}),mx=Math.max.apply(null,us.map(function(u){return units[u].high*3+units[u].medium*1.5+units[u].low*.5}).concat([1]));
  var bars=us.map(function(u){var x=units[u],t=x.high*3+x.medium*1.5+x.low*.5;return '<div class="b2"><div class="r"><span class="nm">'+esc(u)+'</span><span class="tr"><span style="display:flex;width:'+Math.max(6,t/mx*100)+'%;height:100%"><i style="background:var(--hi);flex:'+x.high*3+'"></i><i style="background:var(--md);flex:'+x.medium*1.5+'"></i><i style="background:var(--lo);flex:'+x.low*.5+'"></i></span></span></div><div class="mono" style="color:var(--mute);margin-left:160px">'+x.high+' high · '+x.medium+' medium · '+x.low+' low</div></div>'}).join('')||'<div class="empty">Nothing open.</div>';
  var gg=s.g,hg=gg.filter(function(x){return x.sev==='high'}),more=Math.max(0,hg.length-8),top=hg.slice(0,8).concat(hg.length<8?gg.filter(function(x){return x.sev!=='high'}).slice(0,Math.min(3,8-hg.length)):[]).map(function(g){var p=split(g.detail);return '<tr><td>'+pill(g.sev)+'</td><td><b>'+esc(g.title)+'</b><div style="color:var(--mute);font-size:13px">'+esc(p.fix||p.why)+'</div></td><td class="mono">'+g.devices+' computer'+(g.devices>1?'s':'')+'</td></tr>'}).join('');
  var stale=s.active-s.fresh;
  return '<div class="grid g4"><div class="card stat"><div class="n">'+s.fresh+'<span style="font-size:20px;color:var(--mute)"> / '+s.active+'</span></div><div class="l">computers reporting in the last 3 days'+(stale?' · '+stale+' gone quiet':'')+'</div></div>'+
   '<div class="card stat"><div class="n">'+model().ag.length+'</div><div class="l">AI agents found</div></div>'+
   '<div class="card stat"><div class="n"><span class="hi">'+s.c.high+'</span> <span class="md">'+s.c.medium+'</span> <span class="lo">'+s.c.low+'</span></div><div class="l">open problems: high, medium, low</div></div>'+

/* ---------- shared numbers for every report ---------- */
var SEVR={high:3,medium:2,low:1,info:0};
var rk=function(s){return SEVR[s]==null?-1:SEVR[s]};
var CATS={security:['Security','Data or systems someone could reach through these agents.'],compliance:['Compliance','Rules, regulators or contracts these agents may break.'],governance:['Governance','Nobody clearly answerable for the agent, or no record of who approved it.'],commercial:['Commercial','Money spent or lost with nothing to show for it.']};
var PRODS=[
 ['executive','Executive briefing','For the COO and the board. Every AI agent, which are high risk and why, who owns them, what each one costs and earns, and a 30, 60 and 90 day plan per agent. Click through to the detail.','exec'],
 ['soundings','Soundings: AI catalogue','A catalogue of every AI agent we found: what it is built with, which model, where it runs, who owns it, and the ones no register lists.','cat'],
 ['sentinel','Sentinel: exposure map','A grid of where the security problems sit, by type of problem and by business unit, plus the agents holding keys.','map'],
 ['keel','Keel: accountability scorecard','Each agent scored on owner, tier, business case, register entry and human sign-off. Shows who is answerable and who is not.','card'],
 ['reckoning','Reckoning: cost and return','A statement of what the agents cost, what they earn, the net, the payback, and where money is leaking.','led']];
function CUR(){var a=S.data.agents.filter(function(x){return x.currency})[0]||S.data.findings.filter(function(x){return x.currency})[0];return a?a.currency:'GBP'}
function money(n,cur){if(n==null||isNaN(n))return '-';cur=cur||CUR();var a=Math.abs(n);try{return new Intl.NumberFormat('en-GB',{style:'currency',currency:cur,maximumFractionDigits:a<100?2:0}).format(n)}catch(e){return Math.round(n)+' '+cur}}
function pkey(f){return(f.check_id||'x')+'|'+String(f.title||'').replace(/\d+/g,'#')}
function lead(t){var m=/^(\d+)/.exec(t||'');return m?+m[1]:0}
function groups(list){
  var m={};list.forEach(function(f){var k=pkey(f),g=m[k];
    if(!g)g=m[k]={key:k,check:f.check_id,module:f.module,cat:f.category||'governance',sev:f.severity,title:f.title,detail:f.detail,devs:{},us:{},refs:{},waste:0,note:'',n:0};
    g.devs[f.device_id]=1;var u=bu(f);(g.us[u]=g.us[u]||{})[f.device_id]=1;g.n++;(f.agent_refs||[]).forEach(function(r){g.refs[r]=1});
    if(f.waste)g.waste+=+f.waste;if(f.waste_note&&!g.note)g.note=f.waste_note;
    if(rk(f.severity)>rk(g.sev))g.sev=f.severity;if(lead(f.title)>lead(g.title)){g.title=f.title;g.detail=f.detail}});
  return Object.keys(m).map(function(k){var g=m[k];g.devices=Object.keys(g.devs).length;g.refList=Object.keys(g.refs);return g}).sort(function(a,b){return rk(b.sev)-rk(a.sev)||b.devices-a.devices})
}
function bu(f){return f.business_unit||'Unassigned'}
function model(){
  var d=S.data,open=d.findings.filter(function(f){return f.status==='open'&&f.severity!=='info'}),g=groups(open),m={};
  d.agents.forEach(function(a){var k=a.agent_ref||(a.name+'|'+(a.platform||'')),u=m[k];
    if(!u)u=m[k]=Object.assign({},a,{key:k,hosts:[],units:[],creds:0,tools:0});
    if(u.hosts.indexOf(a.hostname)<0)u.hosts.push(a.hostname);if(u.units.indexOf(bu(a))<0)u.units.push(bu(a));
    u.creds=Math.max(u.creds,a.credential_count||0);u.tools=Math.max(u.tools,a.tool_count||0);if(!u.owner&&a.owner)u.owner=a.owner;if(!u.dept&&a.dept)u.dept=a.dept;
    ['benefit_pm','run_cost_pm','build_cost','payback_months'].forEach(function(c){if(u[c]==null&&a[c]!=null)u[c]=a[c]});if(!u.case_name&&a.case_name)u.case_name=a.case_name});
  var ag=Object.keys(m).map(function(k){return m[k]}),byRef={};
  ag.forEach(function(a){byRef[a.agent_ref||a.key]=a;
    a.gs=g.filter(function(x){return a.agent_ref&&x.refList.indexOf(a.agent_ref)>=0});
    a.risk=a.gs.reduce(function(r,x){return rk(x.sev)>rk(r)?x.sev:r},'none');
    a.cat={};Object.keys(CATS).forEach(function(c){var L=a.gs.filter(function(x){return x.cat===c});a.cat[c]={n:L.length,sev:L.reduce(function(r,x){return rk(x.sev)>rk(r)?x.sev:r},'none')}});
    a.waste=a.gs.reduce(function(n,x){return n+(x.cat==='commercial'?x.waste:0)},0);
    a.net=(a.benefit_pm!=null&&a.run_cost_pm!=null)?a.benefit_pm-a.run_cost_pm:null});
  var nd={};open.forEach(function(f){nd[f.device_id]=1});
  var cost=0,ben=0,cased=0;ag.forEach(function(a){if(a.run_cost_pm!=null)cost+=a.run_cost_pm;if(a.benefit_pm!=null){ben+=a.benefit_pm;cased++}});

/* ---------- 4. Keel: accountability scorecard ---------- */
function rKeel(M){
  var ag=M.ag,reg={},gate={};M.g.forEach(function(x){if(/no register lists/i.test(x.title))x.refList.forEach(function(r){reg[r]=1});if(x.check==='human_gate')x.refList.forEach(function(r){gate[r]=1})});

  var tot=T.map(function(t,i){var n=ag.filter(function(a){return a.kc[i]}).length;return '<div class="kcol"><b>'+n+'<small>/'+ag.length+'</small></b><span>'+t+'</span></div>'}).join('');
  var rows=ag.slice().sort(function(a,b){return a.ks-b.ks||(a.name<b.name?-1:1)}).map(function(a){return '<tr><td><b>'+esc(a.name)+'</b><div style="color:var(--mute);font-size:13px">'+esc(fn(a))+'</div></td>'+a.kc.map(function(k){return '<td class="kt">'+(k?'<span class="ok">&#10003;</span>':'<span class="hi">&#10007;</span>')+'</td>'}).join('')+'<td><span class="dots">'+[0,1,2,3,4].map(function(i){return '<i class="'+(i<a.ks?'on '+(a.ks<3?'lo2':a.ks<5?'mid':'full'):'')+'"></i>'}).join('')+'</span></td><td style="font-size:13.5px">'+(a.owner?esc(a.owner):'<span class="hi">Nobody</span>')+'</td></tr>'}).join('');
  var fu={};ag.forEach(function(a){var k=fn(a),o=fu[k]=fu[k]||{n:0,o:0,s:0};o.n++;if(a.owner)o.o++;o.s+=a.ks});
  var gap=Object.keys(fu).sort(function(a,b){return fu[a].s/fu[a].n-fu[b].s/fu[b].n}).map(function(k){var o=fu[k];return '<tr><td><b>'+esc(k)+'</b></td><td>'+o.n+'</td><td class="'+(o.o<o.n?'hi':'')+'">'+o.o+' of '+o.n+'</td><td class="mono">'+(o.s/o.n).toFixed(1)+' / 5</td></tr>'}).join('');
  var worst=ag.filter(function(a){return a.ks<=2}).length;
  return '<div class="rp kl" style="--ra:#5B4BC4">'+rpHead('Keel &middot; accountability','Who answers for each agent',ag.length?'<b>'+owned+' of '+ag.length+' agents have a named owner.</b>'+(worst?' <span class="hi">'+worst+' meet two or fewer of the five basic controls.</span>':' Each is scored on five basic controls below.'):'No agents found yet.')+
   '<div class="card" style="display:flex;gap:26px;align-items:center;flex-wrap:wrap"><div style="text-align:center">'+ring+'<div class="mono" style="color:var(--mute)">have an owner</div></div><div class="kcols">'+tot+'</div></div>'+
   '<h2 style="font-size:22px;margin:28px 0 8px">Agent by agent, weakest first</h2><div class="card tw"><table><thead><tr><th>Agent</th>'+T.map(function(t){return '<th class="kt">'+t+'</th>'}).join('')+'<th>Score</th><th>Owner</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<h2 style="font-size:22px;margin:28px 0 8px">Gaps by function</h2><div class="card tw"><table><thead><tr><th>Function</th><th>Agents</th><th>With owner</th><th>Average score</th></tr></thead><tbody>'+gap+'</tbody></table></div></div>'
}

/* ---------- 5. Reckoning: cost and return ---------- */
function rReck(M){
  var cur=M.cur,ag=M.ag.filter(function(a){return a.run_cost_pm!=null||a.benefit_pm!=null}),cased=ag.filter(function(a){return a.benefit_pm!=null}),nocase=ag.filter(function(a){return a.benefit_pm==null&&a.run_cost_pm>0}),net=M.ben-M.cost;
  var mx=Math.max.apply(null,ag.map(function(a){return Math.max(a.run_cost_pm||0,a.benefit_pm||0)}).concat([1]));
  var rows=ag.slice().sort(function(a,b){return(a.net==null)-(b.net==null)||(a.net||0)-(b.net||0)}).map(function(a){return '<tr><td><b>'+esc(a.name)+'</b><div style="color:var(--mute);font-size:12.5px">'+esc(a.case_name||fn(a))+'</div></td><td style="width:34%"><div class="bb"><i class="c" style="width:'+((a.run_cost_pm||0)/mx*100)+'%"></i></div><div class="bb"><i class="g" style="width:'+((a.benefit_pm||0)/mx*100)+'%"></i></div></td><td class="num">'+money(a.run_cost_pm,cur)+'</td><td class="num">'+(a.benefit_pm!=null?money(a.benefit_pm,cur):'<span style="color:var(--mute)">no case</span>')+'</td><td class="num '+(a.net!=null&&a.net<0?'hi':'ok')+'">'+(a.net!=null?money(a.net,cur):'-')+'</td><td class="num">'+(a.payback_months!=null?a.payback_months+' mo':'-')+'</td></tr>'}).join('');
  var leaks=M.g.filter(function(x){return x.waste>0}).sort(function(a,b){return b.waste-a.waste});
  var wasteTot=leaks.reduce(function(n,x){return n+x.waste},0);
  return '<div class="rp rc" style="--ra:#2E7D32">'+rpHead('Reckoning &middot; economics','What the agents cost and what they earn',ag.length?'Agents cost <b>'+money(M.cost,cur)+'</b> a month to run. '+(cased.length?'<b>'+cased.length+'</b> have a recorded benefit, worth <b>'+money(M.ben,cur)+'</b> a month, a net of <b class="'+(net<0?'hi':'ok')+'">'+money(net,cur)+'</b>.':'<b class="hi">None has a recorded benefit, so the return cannot be measured.</b>')+(wasteTot>0?' Separately, <b>'+money(wasteTot,cur)+'</b> was spent that could have been avoided.':''):'No cost data has been reported yet.')+
   (nocase.length?'<div class="card" style="border-color:var(--md);margin-bottom:18px"><b>'+nocase.length+' agent'+(nocase.length>1?'s':'')+' cost money with no business case:</b> '+esc(nocase.map(function(a){return a.name}).slice(0,8).join(', '))+(nocase.length>8?' and '+(nocase.length-8)+' more':'')+'. Write down what each is meant to earn, or switch it off.</div>':'')+
   '<div class="led"><div class="ledh"><span>Statement by agent, per month</span><span class="mono"><i class="kc"></i> cost <i class="kg"></i> benefit</span></div><div class="tw"><table><thead><tr><th>Agent</th><th></th><th class="num">Cost</th><th class="num">Benefit</th><th class="num">Net</th><th class="num">Payback</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><td><b>Total</b></td><td></td><td class="num"><b>'+money(M.cost,cur)+'</b></td><td class="num"><b>'+(M.cased?money(M.ben,cur):'-')+'</b></td><td class="num '+(net<0?'hi':'ok')+'"><b>'+(M.cased?money(net,cur):'-')+'</b></td><td></td></tr></tfoot></table></div></div>'+
   '<h2 style="font-size:22px;margin:28px 0 8px">Where money is leaking</h2>'+(leaks.length?'<div class="card tw"><table><thead><tr><th>Problem</th><th>Agents</th><th class="num">Wasted</th></tr></thead><tbody>'+leaks.map(function(x){var s=split(x.detail);return '<tr><td><b>'+esc(x.title)+'</b><div style="color:var(--mute);font-size:13px">'+esc(x.note||s.why)+'</div><div style="font-size:13.5px;margin-top:4px">'+esc(s.fix)+'</div></td><td>'+esc(x.refList.map(function(r){return nm(M,r)}).join(', ')||'-')+'</td><td class="num hi">'+money(x.waste,cur)+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="lead">No avoidable spend found.</p>')+'</div>'
}

/* ---------- reports tab ---------- */
S.rep=null;S.rx={};
function vReports(){
  var d=S.data,ent=function(p){return d.entitled.indexOf(p)>=0};
  if(S.rep){var M=model(),f={executive:rExec,soundings:rSound,sentinel:rSent,keel:rKeel,reckoning:rReck}[S.rep];if(f&&ent(S.rep))return f(M);S.rep=null}
  var lk={};(d.locked||[]).forEach(function(x){lk[x.module]=x.n});
  var cards=PRODS.map(function(p){var on=ent(p[0]),mod={soundings:'discover',sentinel:'secure',keel:'govern',reckoning:'economics'}[p[0]],n=mod?lk[mod]:0;
    return '<div class="card rep rpc rc-'+p[3]+'"><div class="mono" style="color:var(--mute);letter-spacing:1px;text-transform:uppercase">'+(on?'Included':'Not included')+'</div><h3>'+esc(p[1])+'</h3><p>'+esc(p[2])+'</p><div>'+(on?'<button class="pri sm" data-rep="'+p[0]+'">Open report</button>':'<button class="sm" disabled style="opacity:.6">Locked</button> <span class="mono" style="color:var(--mute)">'+(n?n+' open problem'+(n>1?'s':'')+' hidden. ':'')+'Ask Antara to add it.</span>')+'</div></div>'}).join('');
  return '<p class="lead">Reports build from what your computers have reported, so they are always current. Each report shows something different. You see the ones your organisation has taken.</p><div class="grid g2" style="margin-top:14px">'+cards+'</div>'+
   '<h3 style="margin:26px 0 8px">Data downloads</h3><div class="grid g4"><div class="card rep"><h3>Findings register (CSV)</h3><p>Every finding with owner, status and dates, to open in Excel.</p><div><button class="pri sm" data-rep="csv-f">Download</button></div></div><div class="card rep"><h3>AI inventory (CSV)</h3><p>Every AI agent found, where, with which model, tools and keys.</p><div><button class="pri sm" data-rep="csv-a">Download</button></div></div></div>'
}
function csv(rows,cols){var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [cols.map(function(c){return c[1]}).join(',')].concat(rows.map(function(r){return cols.map(function(c){return q(r[c[0]])}).join(',')})).join('\n')}
function save(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
function report(kind){
  var d=S.data;
  if(kind==='csv-f')return save('findings-register.csv',csv(d.findings,[['hostname','Computer'],['business_unit','Business unit'],['module','Area'],['category','Impact'],['severity','Level'],['title','Finding'],['detail','Detail'],['status','Status'],['owner','Owner'],['first_seen','First seen'],['last_seen','Last seen'],['resolved_at','Resolved']]),'text/csv');
  if(kind==='csv-a')return save('ai-inventory.csv',csv(d.agents,[['name','Agent'],['hostname','Computer'],['business_unit','Business unit'],['dept','Function'],['owner','Owner'],['tier','Tier'],['platform','Built with'],['model','Model'],['tool_count','Tools'],['credential_count','Keys'],['run_cost_pm','Run cost a month'],['benefit_pm','Benefit a month'],['last_seen','Last seen']]),'text/csv');
  S.rep=kind;S.rx={};render();window.scrollTo(0,0)
}

sb.auth.getSession().then(function(r){if(r.data.session){S.session=r.data.session;boot()}else authView()});
})();
</script>
