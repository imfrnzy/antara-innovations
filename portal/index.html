<style>

@media print{.top,.noprint{display:none!important}main{padding:0;max-width:none}body{background:#fff}.sx{-webkit-print-color-adjust:exact;print-color-adjust:exact}tr.row{break-inside:avoid}}

.pill.crit{background:var(--hi);color:#fff;border-color:var(--hi)}

.tree,.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line)}.tree{border:0;padding-left:0}.tree li{margin:6px 0}.tree .tn{font-weight:600}details.tech>summary::-webkit-details-marker{display:none}details.tech[open]>summary .pill{display:none}

function shell(){
  $('who').textContent=(S.email||'')+' · '+(S.org?S.org.role:'');$('out').style.display='';

  $('tabs').style.display='';$('tabs').innerHTML=(S.isOp?[['clients','All clients']].concat(TABS):TABS).map(function(t){return '<a href="#'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</a>'}).join('');

siness context), cannot show provider-side documentation, training data, bias testing or conformity assessment, and cannot see server-hosted systems. Cannot prove human oversight happened, only that an...","helps":"Shows which AI tools and agents exist on endpoints, who uses them, and which are unapproved. That is the raw material for the Art 4 programme scope, the deployer inventory, and spotting tools that may drift into a prohibited or high-risk use (for example CV...","fit":"partial","pen":"Up to EUR 35m or 7% worldwide turnover (prohibited practices); EUR 15m or 3% (most other obligations); EUR 7.5m or 1% (incorrect information). Penalty ceilings unchanged...","ver":"V","vdate":"2026-11-12","src":["https://www.lewissilkin.com/insights/2026/07/27/the-digital-omnibus-on-ai-enters-into-force-today","https://www.whitecase.com/insight-alert/eu-ai-omnibus-enters-force-amending-ai-act"]},{"id":"eu-gdpr","name":"General Data Protection Regulation, Regulation (EU) 2016/679","jur":["EU"],"ind":["all"],"type":"law","status":"In force since 25 May 2018. Targeted amendments proposed in the Digital Omnibus (see eu-digital-omnibus-data), not law.","dates":[{"d":"2018-05-25","t":"applies"}],"acct":"Controller (management body) and processor; Data Protection Officer where required (Art 37) advises and monitors; DPO is not personally liable.","obl":["Records of processing (Art 30) must cover AI tools that touch personal data.","DPIA (Art 35) before high-risk processing, including new AI uses.","Security of processing (Art 32) and breach notification to the authority within 72 hours (Art 33)."],"themes":["inventory","traceability","third_party","security","data","incident"],"evidence":"Record of processing including AI tools; DPIAs; Processor agreements and transfer assessments for AI vendors; Breach log and notifications","limits":"Cannot see what personal data was actually sent to a SaaS model, nor the vendor's retention or training use. Cannot decide lawful basis or DPIA outcome.","helps":"Finds shadow AI tools where staff may paste personal data (feeds Art 30 and vendor/processor discovery), local models and agents with access to files containing personal data, and credentials that widen the breach surface.","fit":"partial","pen":"Up to EUR 20m or 4% worldwide turnover (Art 83).","ver":"P","vdate":"2026-11-12","src":["https://eur-lex.europa.eu/eli/reg/2016/679/oj","https://www.lewissilkin.com/insights/2026/11/09/digital-rulebook-simplification-of-eu-data-protection-and-cyber-rules-102o7e4"]},{"id":"eu-digital-omnibus-data","name":"Digital Omnibus on data, GDPR, ePrivacy and cyber incident reporting (COM(2025) 836/837)","jur":["EU"],"ind":["all"],"type":"proposal","status":"Proposed. Council agreed its negotiating position on 21 Oct 2026. Parliament position not reached per the source; no trilogue yet. EU leaders aim to finish simplification packages by end of 2027.","dates":[{"d":"2026-10-21","t":"Council position"}],"acct":"Same as GDPR/NIS2 if adopted.","obl":["Council would extend GDPR breach notification to 96 hours and keep the high-risk threshold.","New Art 25a on when pseudonymised data is personal data (EDPS v SRB).","Clarified legal basis for personal data in AI development, with safeguards for sensitive data."],"themes":["security","data","incident"],"evidence":"None yet; watch item","limits":"n/a as it is not in force.","helps":"Nothing directly. Useful only to show clients the calendar.","fit":"weak","pen":"n/a","ver":"V","vdate":"2026-11-12","src":["https://www.lewissilkin.com/insights/2026/11/09/digital-rulebook-simplification-of-eu-data-protection-and-cyber-rules-102o7e4","https://conventuslaw.com/report/digital-omnibus-package-single-eu-harmonised-incident-reporting-regime-across-cyber-and-data-protection-regime/"]},{"id":"eu-nis2","name":"NIS2 Directive (EU) 2022/2555","jur":["EU"],"ind":["all"],"type":"law","status":"In force; transposition deadline was 17 Oct 2024 and many states are late. Per Fieldfisher snapshot at   var leaks=M.g.filter(function(x){return x.waste>0}).sort(function(a,b){return b.waste-a.waste}),wasteTot=leaks.reduce(function(n,x){return n+x.waste},0);

var KINDS={agent:'AI agent',app:'AI app people use',coding:'Coding assistant',cli:'Command line AI tool',model:'Local model',local:'Local model runner'};

var _model=model;
model=function(){
  var M=_model(),mm={},mr={};

  M.noCase=M.ag.filter(function(a){return isAg(a)&&!a.hasCase}).length;

  M.g.forEach(function(g){if(g.check==='model_register')g.refList.forEach(function(r){mr[r]=1})});
  M.ag.forEach(function(a){var ms=(a.models&&typeof a.models==='object')?a.models:{},ks=Object.keys(ms);if(!ks.length&&a.model){ms={};ms[a.model]=a.run_count||0;ks=[a.model]}
    ks.forEach(function(k){var o=mm[k]=mm[k]||{name:k,sys:[],runs:0,local:false,bad:false};if(o.sys.indexOf(a.key)<0)o.sys.push(a.key);o.runs+=ms[k]||0;if(a.kind==='model'||a.kind==='local'||(!isAg(a)&&/:/.test(k)))o.local=true;if(mr[a.agent_ref||a.key])o.bad=true})});
  M.models=Object.keys(mm).map(function(k){return mm[k]}).sort(function(a,b){return b.runs-a.runs||b.sys.length-a.sys.length});
  var lm={};(S.data.links||[]).forEach(function(l){var k=l.from_ref+'>'+l.to_ref,o=lm[k];if(!o)o=lm[k]={from:l.from_ref,to:l.to_ref,kind:l.kind,basis:l.basis,calls:0,external:false,hosts:[]};o.calls=Math.max(o.calls,l.calls||0);if(l.external)o.external=true;if(l.basis==='observed'&&o.basis==='declared')o.basis='both';if(o.hosts.indexOf(l.hostname)<0)o.hosts.push(l.hostname)});
  M.links=Object.keys(lm).map(function(k){var o=lm[k],fa=M.byRef[o.from],ta=M.byRef[o.to];o.fa=fa;o.ta=ta;o.cross=!!(fa&&ta&&fa.dept&&ta.dept&&fa.dept!==ta.dept);o.undecl=o.basis==='observed';o.unowned=!!((fa&&!fa.owner)||(ta&&!ta.owner));return o}).sort(function(a,b){return (b.undecl-a.undecl)||(b.external-a.external)||b.calls-a.calls});
  return M
};

  var node=function(a,d,seen){var r=a.agent_ref||a.key;if(seen.indexOf(r)>=0||d>6)return '';var kids=(ch[r]||[]).map(function(c){return node(c,d+1,seen.concat(r))}).join('');

function rConn(M){

   '<div class="card" style="margin-bottom:18px"><h3>In plain words</h3><ul style="margin:6px 0 0;padding-left:18px;line-height:1.6"><li><b>Person.</b> Every AI system needs one named person who answers for it. A team name or a vendor does not count.</li><li><b>Role.</b> Above that person sits an executive who is accountable to your regulator. We list what each rule that applies to you says about that. We cannot see who holds that role. You tell us.</li><li><b>Links.</b> When one AI system hands work to another, somebody must own that handover. Where the two ends have different owners, nobody does.</li><li><b>Models.</b> Someone must approve which models may be used for which risk. We see the approved list in your policy file. We cannot see who signed it.</li></ul></div>'+
